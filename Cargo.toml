[package]
name = "toasteddrums"
version = "0.1.0"
edition = "2021"
description = "ToastedDrums: a toy-keyboard drum machine for the laptop, visualized on the desk annunciator (panels 1/2). Zero crates, house style."

[[bin]]
name = "toasteddrums"
path = "src/main.rs"

[dependencies]
cpal = "=0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The operator UI. Vetted like cpal: emilk/egui, pinned, registry-only tree. Default
# features off because 0.36 defaults to wgpu (a huge tree); glow is a single GL context.
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
